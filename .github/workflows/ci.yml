name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Spring Boot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts a real PostgreSQL in Docker
      - name: Build and test
        run: mvn -B -ntp verify

  inference:
    name: Python inference service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: inference-service/requirements*.txt
      - name: Install (CPU PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, inference]
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
